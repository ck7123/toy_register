<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おもちゃのレジ</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff0f6;--card:#fff;--tx:#5a3a4a;--ac:#ff6fae;--ok:#ff5fa2;--bd:#ffc9e0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b1a26;--card:#3a2433;--tx:#ffe6f1;--ac:#ff8fc2;--ok:#ff8fc2;--bd:#5c3a50}}
:root[data-theme="dark"]{--bg:#2b1a26;--card:#3a2433;--tx:#ffe6f1;--ac:#ff8fc2;--ok:#ff8fc2;--bd:#5c3a50}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:radial-gradient(var(--bd) 3px,transparent 3px);background-size:30px 30px;color:var(--tx);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;padding:12px}
nav{display:flex;margin-bottom:12px}nav button{margin-right:8px}
nav button,.btn{font:inherit;font-size:1.1rem;border:0;border-radius:999px;padding:14px 24px;background:var(--card);color:var(--tx);border:2px solid var(--bd)}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:bold}
.btn.ok{background:var(--ok);border-color:var(--ok)}
#reg{display:grid;grid-template-columns:minmax(260px,1fr) minmax(280px,1fr);grid-gap:12px;gap:12px}
@media(max-width:700px){#reg{grid-template-columns:1fr}}
.card{background:var(--card);border:3px solid var(--bd);border-radius:28px;padding:14px;box-shadow:0 4px 0 var(--bd)}
video{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:20px;background:#000}
#msg{font-size:1.6rem;font-weight:bold;margin:8px 0;min-height:2em}
#list{list-style:none;margin:0;padding:0;min-height:120px}
#list li{display:flex;justify-content:space-between;font-size:1.9rem;padding:6px 4px;border-bottom:1px dashed var(--bd)}
#total{font-size:3.2rem;font-weight:bold;text-align:right;margin:8px 0;color:var(--ac)}
#done{display:none;text-align:center;padding:30px 10px}
#done h1{font-size:3rem;color:var(--ok);margin:0 0 8px}
#sheet{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));grid-gap:10px;gap:10px}
.item{text-align:center;break-inside:avoid}
.item svg{max-width:100%;height:auto}
.item b{display:block;font-size:1.2rem}
.qr svg{width:150px;height:150px}
.bar{background:#fff;border-radius:8px}
.shop{text-align:center;font-size:2rem;font-weight:bold;color:var(--ac);margin:2px 0 10px}
#pay{font-size:1.7rem;padding:16px 30px}
.pop{font-size:4.5rem;animation:pop .7s ease}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
.row{display:flex;flex-wrap:wrap;margin-top:8px}.row>*{margin:0 8px 8px 0}.row input{font:inherit;font-size:1.1rem;padding:10px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);flex:1;min-width:120px}
.dl{margin-top:8px;font:inherit;padding:6px 12px;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:var(--tx)}
@media print{nav,#reg,.noprint{display:none!important}#sheet{display:block!important}body{background:#fff;color:#000}.card{border-color:#999}}
</style>
</head>
<body>
<nav class="noprint">
  <button id="t1" class="on">レジ</button>
  <button id="t2">しょうひん・印刷</button>
</nav>
<div class="shop noprint">🎀 おみせやさん 🎀</div>

<div id="reg">
  <div class="card">
    <video id="v" playsinline muted></video>
    <div id="msg">「スタート」をおしてね</div>
    <button class="btn" id="start">スタート</button><button class="btn" id="flip" style="margin-left:8px">インカメラにする</button>
  </div>
  <div class="card">
    <div id="main">
      <ul id="list"></ul>
      <div id="total">0円</div>
      <button class="btn" id="pay">おかいけい</button>
      <button class="btn" id="clear" style="background:var(--card);color:var(--tx)">ぜんぶけす</button>
    </div>
    <div id="done">
      <div class="pop">🎉💖🎉</div>
      <h1>支払い完了！</h1>
      <div style="font-size:1.8rem;margin-bottom:16px">ありがとう！またきてね 💕</div>
      <button class="btn ok" id="next">つぎのおきゃくさま</button>
    </div>
  </div>
</div>

<div id="sheet">
  <div class="card noprint" style="margin-bottom:12px">
    <b style="font-size:1.2rem">しょうひんをふやす</b>
    <div class="row"><input id="pnum" type="number" inputmode="numeric" min="1" max="999" placeholder="ばんごう TOY○○○（空でもOK）"><input id="pname" placeholder="なまえ（例: みかん）" maxlength="12"><input id="pprice" type="number" inputmode="numeric" min="1" max="99999" placeholder="ねだん（円）"><button class="btn" id="padd" style="margin:0">ついか</button></div>
    <div id="pmsg" style="margin-top:6px"></div>
  </div>
  <p class="noprint">ついかすると下にバーコードがふえます。印刷して、商品に切り取って貼ってね。バーコードは白い背景のまま、できるだけ大きく切り取ると読み取りやすいです。</p>
  <button class="btn noprint" id="psort" style="margin:0 8px 12px 0">ばんごうじゅんにならべる</button><button class="btn noprint" onclick="window.print()" style="margin-bottom:12px">印刷する</button>
  <div class="grid" id="grid"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
// はじめから入っている商品（あとから画面でふやせます）
var DEFAULTS = {
  "TOY001": ["りんご", 100],
  "TOY002": ["バナナ", 80],
  "TOY003": ["ぎゅうにゅう", 150],
  "TOY004": ["おにぎり", 120],
  "TOY005": ["クッキー", 50],
  "TOY006": ["ジュース", 130]
};
var PAY_CODE = "TOYPAY";

var PRODUCTS = {};
function loadProducts(){
  var data = null;
  try{ var s = localStorage.getItem("toyProducts"); if(s) data = JSON.parse(s); }catch(e){}
  var ok = data && typeof data === "object" && Object.keys(data).length > 0 && Object.keys(data).every(function(k){ return Array.isArray(data[k]) && data[k].length === 2; });
  PRODUCTS = ok ? data : JSON.parse(JSON.stringify(DEFAULTS));
}
function saveProducts(){ try{ localStorage.setItem("toyProducts", JSON.stringify(PRODUCTS)); }catch(e){} }
function nextCode(){ var n = 1; while(PRODUCTS["TOY" + ("000" + n).slice(-3)]) n++; return "TOY" + ("000" + n).slice(-3); }
function addProduct(){
  var name = document.getElementById("pname").value.trim();
  var price = parseInt(document.getElementById("pprice").value, 10);
  var m = document.getElementById("pmsg");
  if(!name){ m.textContent = "なまえをいれてね"; return; }
  if(!(price > 0)){ m.textContent = "ねだんを1円いじょうでいれてね"; return; }
  var numStr = document.getElementById("pnum").value.trim(), code;
  if(numStr){
    var n = parseInt(numStr, 10);
    if(!(n >= 1 && n <= 999)){ m.textContent = "ばんごうは1から999でいれてね"; return; }
    code = "TOY" + ("000" + n).slice(-3);
    if(PRODUCTS[code]){ m.textContent = code + " は「" + PRODUCTS[code][0] + "」でつかわれています"; return; }
  } else { code = nextCode(); }
  PRODUCTS[code] = [name, price];
  saveProducts(); buildSheet();
  document.getElementById("pname").value = ""; document.getElementById("pprice").value = ""; document.getElementById("pnum").value = "";
  setTimeout(function(){ m.textContent = m.textContent + "（" + code + "）"; }, 0);
  m.textContent = name + " をついかしました";
}
function delProduct(code){ delete PRODUCTS[code]; saveProducts(); buildSheet(); }
function sortProducts(){
  var sorted = {};
  Object.keys(PRODUCTS).sort().forEach(function(k){ sorted[k] = PRODUCTS[k]; });
  PRODUCTS = sorted; saveProducts(); buildSheet();
  document.getElementById("pmsg").textContent = "ばんごうじゅんにならべました";
}
var EMOJI = {"りんご":"🍎","バナナ":"🍌","ぎゅうにゅう":"🥛","おにぎり":"🍙","クッキー":"🍪","ジュース":"🥤","みかん":"🍊","いちご":"🍓","パン":"🍞","たまご":"🥚","ケーキ":"🍰","アイス":"🍦"};
function emo(n){ return EMOJI[n] || "🎀"; }
loadProducts();

var items = [], mode = "scan", last = "", lastT = 0, ac = null, reader = null, facing = "environment";
var $ = function(id){return document.getElementById(id)};

function beep(freq, start, dur, vol){
  if(!ac) return;
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = "sine"; o.frequency.value = freq;
  var t = ac.currentTime + (start||0);
  g.gain.setValueAtTime(vol||0.3, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur);
}
function scanSound(){
  if(!ac) return;
  var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = "square"; o.frequency.value = 2500;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.12, t + 0.005);
  g.gain.setValueAtTime(0.12, t + 0.09);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + 0.13);
}

function payBtnSound(){ beep(784,0,0.12,0.25); beep(1047,0.1,0.22,0.25); }
function nextSound(){ beep(1319,0,0.1,0.25); beep(1760,0.09,0.12,0.25); beep(2093,0.18,0.28,0.25); }
var payBuf = null;
function paySound(){
  if(ac && payBuf){ var s = ac.createBufferSource(); s.buffer = payBuf; s.connect(ac.destination); s.start(0); return; }
  try{ payAudio.currentTime = 0; var r = payAudio.play(); if(r && r.catch) r.catch(function(){ beep(880,0,0.15); beep(1175,0.15,0.15); beep(1568,0.3,0.4); }); }catch(e){ beep(1568,0,0.4); }
}

function render(){
  var ul = $("list"), sum = 0;
  ul.innerHTML = "";
  items.forEach(function(it, idx){
    sum += it[1];
    var li = document.createElement("li");
    li.style.alignItems = "center";
    li.innerHTML = "<span></span><span style='margin-left:auto'>" + it[1] + "円</span>";
    li.firstChild.textContent = emo(it[0]) + " " + it[0];
    var x = document.createElement("button"); x.className = "dl"; x.textContent = "×";
    x.style.margin = "0 0 0 10px"; x.style.fontSize = "1.2rem";
    x.onclick = function(){ items.splice(idx, 1); render(); $("msg").textContent = it[0] + " をけしました"; };
    li.appendChild(x);
    ul.appendChild(li);
  });
  $("total").textContent = sum + "円";
}

function onCode(text){
  var now = Date.now();
  if(text === last && now - lastT < 1800) return;
  last = text; lastT = now;
  if(mode === "scan"){
    var p = PRODUCTS[text];
    if(p){ items.push(p); scanSound(); $("msg").textContent = p[0] + "　" + p[1] + "円"; render(); }
    else if(text === PAY_CODE){ $("msg").textContent = "「おかいけい」をおしてからだよ"; }
    else { $("msg").textContent = "よみとれないバーコードだよ"; }
  } else if(mode === "pay"){
    if(text === PAY_CODE){
      paySound(); mode = "done";
      $("main").style.display = "none"; $("done").style.display = "block";
      $("msg").textContent = "";
    } else { $("msg").textContent = "PayPayのQRコードをかざしてね"; }
  }
}

$("start").onclick = function(){
  try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if(ac.resume) ac.resume(); }catch(e){}
  scanSound();
  if(ac && !payBuf && ac.decodeAudioData){
    try{
      var bin = atob(payAudio.src.split(",")[1]), u = new Uint8Array(bin.length);
      for(var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      ac.decodeAudioData(u.buffer, function(b){ payBuf = b; }, function(){});
    }catch(e){}
  }
  if(typeof ZXing === "undefined"){ $("msg").textContent = "よみとりのぶひんがよみこめません。ネットにつながっているか確認してね"; return; }
  if(reader){ try{ reader.reset(); }catch(e){} }
  reader = new ZXing.BrowserMultiFormatReader();
  $("msg").textContent = "カメラをじゅんび中…";
  reader.decodeFromConstraints({video:{facingMode:{ideal:facing}}}, "v", function(res){
    if(res) onCode(res.getText());
  }).then(function(){
    $("msg").textContent = "バーコードをカメラにかざしてね";
    $("start").style.display = "none";
  }).catch(function(e){
    $("msg").textContent = "カメラがつかえません。カメラのきょかを確認してね（" + ((e && e.name) || "エラー") + "）";
  });
};
$("pay").onclick = function(){
  if(!items.length){ $("msg").textContent = "まだ商品がないよ"; return; }
  payBtnSound(); mode = "pay"; $("msg").textContent = "PayPayのQRコードをかざしてね"; last = "";
};
$("clear").onclick = function(){ items = []; mode = "scan"; render(); $("msg").textContent = "バーコードをカメラにかざしてね"; };
$("next").onclick = function(){
  nextSound();
  items = []; mode = "scan"; last = ""; render();
  $("done").style.display = "none"; $("main").style.display = "block";
  $("msg").textContent = "バーコードをカメラにかざしてね";
};

function tab(n){
  $("reg").style.display = n === 1 ? "" : "none";
  $("sheet").style.display = n === 2 ? "block" : "none";
  $("t1").className = n === 1 ? "on" : ""; $("t2").className = n === 2 ? "on" : "";
}
$("t1").onclick = function(){ tab(1); };
$("t2").onclick = function(){ tab(2); };

function buildSheet(){
  var g = $("grid"); g.innerHTML = "";
  Object.keys(PRODUCTS).forEach(function(code){
    var d = document.createElement("div"); d.className = "card item";
    var s = document.createElement("svg"); d.appendChild(document.createElement("b")).textContent = PRODUCTS[code][0] + "　" + PRODUCTS[code][1] + "円";
    var svg = document.createElementNS("http://www.w3.org/2000/svg","svg"); svg.setAttribute("class","bar");
    d.appendChild(svg);
    try{ JsBarcode(svg, code, {format:"CODE128", width:2, height:70, margin:10, fontSize:14}); }catch(e){}
    var dl = document.createElement("button"); dl.className = "dl noprint"; dl.textContent = "けす";
    dl.onclick = function(){ delProduct(code); };
    d.appendChild(dl);
    g.appendChild(d);
  });
  var q = document.createElement("div"); q.className = "card item qr";
  q.innerHTML = "<b>PayPay（おもちゃ）</b>";
  try{ var qr = qrcode(0,"M"); qr.addData(PAY_CODE); qr.make(); var w = document.createElement("div"); w.className="bar"; w.style.padding="8px"; w.innerHTML = qr.createSvgTag(5,0); q.appendChild(w); }catch(e){}
  g.appendChild(q);
}
buildSheet();
$("padd").onclick = addProduct;
$("psort").onclick = sortProducts;
$("flip").onclick = function(){
  facing = facing === "user" ? "environment" : "user";
  $("v").style.webkitTransform = $("v").style.transform = facing === "user" ? "scaleX(-1)" : "none";
  $("flip").textContent = facing === "user" ? "アウトカメラにする" : "インカメラにする";
  if(reader) $("start").onclick();
};
